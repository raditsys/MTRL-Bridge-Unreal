<style>

*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.35 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}

header{display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:#080909;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:11px;min-width:258px}.mark{width:25px;height:25px;position:relative;transform:skew(-10deg)}.mark:before,.mark:after{content:"";position:absolute;background:var(--acid)}.mark:before{left:0;top:0;width:7px;height:25px}.mark:after{left:9px;top:0;width:16px;height:7px;box-shadow:0 18px 0 var(--acid)}
.brand strong{font-size:15px;letter-spacing:.15em}.brand span{color:var(--muted);font-size:10px;letter-spacing:.15em;margin-left:3px}
.toolbar{display:flex;align-items:center;gap:7px;flex:1}.btn{border:1px solid var(--line2);background:#111414;padding:8px 11px;border-radius:3px;text-transform:uppercase;font-weight:800;letter-spacing:.08em;font-size:10px}.btn:hover{border-color:#59605f;background:#171a1a}.btn.primary{background:var(--acid);border-color:var(--acid);color:#080908}.btn.cyan{border-color:#2a6c64;color:var(--cyan)}.btn.ai{border-color:#754466;color:var(--pink);background:#171014}.btn.ai:hover{border-color:var(--pink);background:#21131c}.btn.danger{color:#ff8d8d}.toolbar .spacer{flex:1}.pill{border:1px solid var(--line);padding:7px 9px;color:var(--muted);font-size:10px;letter-spacing:.07em;text-transform:uppercase}.pill b{color:var(--acid)}

#stageWrap{position:relative;overflow:hidden;background-color:#090b0b;background-image:linear-gradient(#151919 1px,transparent 1px),linear-gradient(90deg,#151919 1px,transparent 1px),linear-gradient(#0e1111 1px,transparent 1px),linear-gradient(90deg,#0e1111 1px,transparent 1px);background-size:64px 64px,64px 64px,16px 16px,16px 16px;background-position:0 0}.stage-label{position:absolute;top:12px;left:13px;z-index:6;color:#4d5652;font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;pointer-events:none}.stage-label b{color:#7b8782}.stage-actions{position:absolute;right:12px;top:12px;z-index:8;display:flex;gap:6px}.mini{border:1px solid var(--line);background:#0c0e0e;padding:6px 8px;color:#78817e;font-size:10px}.mini:hover{color:white;border-color:#4e5754}

.node{position:absolute;width:184px;cursor:move;background:#111414;border:1px solid #333a38;border-top:3px solid var(--accent,#69716e);box-shadow:0 13px 30px rgba(0,0,0,.3);user-select:none}.node.selected{outline:1px solid var(--acid);box-shadow:0 0 0 3px rgba(215,255,63,.08),var(--shadow)}.node.primary-selected{outline:2px solid var(--acid);outline-offset:1px}.marquee{position:absolute;display:none;z-index:30;pointer-events:none;border:1px solid var(--acid);background:rgba(215,255,63,.075);box-shadow:0 0 0 1px rgba(215,255,63,.12) inset}.marquee.show{display:block}.node-head{padding:8px 9px 7px;border-bottom:1px solid #252a28;display:flex;align-items:center;gap:7px;cursor:move}.node-head .type{font-size:9px;color:#707a76;letter-spacing:.1em;text-transform:uppercase}.node-head .name{font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.node-body{padding:6px 0;min-height:34px}.pin-row{min-height:24px;cursor:move;display:flex;align-items:center;position:relative;font-size:10px;color:#9ea7a3}.pin-row.out{justify-content:flex-end;text-align:right}.pin-label{padding:0 11px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pin{width:11px;cursor:crosshair;height:11px;border:2px solid #7a8581;background:#111414;position:absolute;top:7px;transform:rotate(45deg);z-index:4}.pin.in{left:-6px}.pin.out{right:-6px;background:#303735}.pin:hover{border-color:var(--acid);background:var(--acid)}.node-foot{border-top:1px solid #222725;color:#56605c;padding:5px 8px;font:9px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-inspector{padding:26px 18px;color:#65706b}.inspect-section{border-bottom:1px solid var(--line);padding:13px 13px 16px}.inspect-section h3{margin:0 0 11px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#909a95}.field{display:grid;gap:5px;margin:9px 0}.field label{font-size:9px;text-transform:uppercase;color:#626d68;letter-spacing:.12em}.field input,.field select,.field textarea{width:100%;background:#080a0a;border:1px solid #2a302e;border-radius:2px;padding:8px 9px;outline:none}.field textarea{min-height:92px;resize:vertical;font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}.field input:focus,.field select:focus,.field textarea:focus{border-color:#596660}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;gap:7px;align-items:center}.row .field{flex:1}.tag{font-size:9px;background:#171b1a;color:#8f9b96;border:1px solid #2d3431;padding:3px 5px}.pin-edit{display:grid;grid-template-columns:1fr 82px 25px;gap:5px;margin:6px 0}.pin-edit input{min-width:0;background:#080a0a;border:1px solid #2a302e;padding:6px}.xbtn{border:1px solid #382c2c;background:#140d0d;color:#c77;padding:0}.smallbtn{width:100%;border:1px dashed #3c4441;background:transparent;color:#7c8782;padding:7px;margin-top:7px}.smallbtn:hover{color:white;border-color:#69736f}.custom-code textarea{min-height:190px;color:#d2dfd9}.notice{border-left:2px solid var(--orange);background:#171310;padding:9px;color:#c8ad9d;font-size:10px;margin:9px 0}.ok{border-left-color:var(--cyan);background:#0d1716;color:#9fcac3}

.toast{position:fixed;bottom:42px;left:50%;transform:translateX(-50%) translateY(12px);background:#121615;border:1px solid #39413e;padding:10px 14px;color:#dfe8e4;z-index:150;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<body>
<div id="app">
<header>
  <div class="brand"><div class="mark"></div><div><strong>MTRL//BRIDGE</strong><span>UE 5.4.x</span></div></div>
  <div class="toolbar">
    <button class="btn" id="newBtn">New</button>
    <button class="btn cyan" id="importBtn">Paste / Import</button>
    <button class="btn ai" id="aiBuildBtn">AI Build</button>
    <button class="btn" id="previewBtn">UE Text</button>
    <button class="btn" id="copyBtn">Copy All</button>
    <button class="btn primary" id="copySelectedBtn">Copy Selected</button>
    <div class="spacer"></div>
    <div class="pill"><b id="nodeCount">0</b> nodes · <b id="edgeCount">0</b> links · <b id="selectedCount">0</b> selected</div>
  </div>
</header>
<div class="workspace">
  <aside class="sidebar">
    <div class="panel-title">Expression palette</div>
    <input class="search" id="search" placeholder="Search nodes…" />
    <div class="categories" id="palette"></div>
  </aside>
  <main id="stageWrap">
    <div class="stage-label">Material graph / <b>box select · shift/ctrl add · drag group · wheel zoom · alt/middle/right pan</b></div>
    <div class="stage-actions"><button class="mini" id="aiContextBtn">AI context</button><button class="mini" id="protocolBtn">AI protocol</button><button class="mini" id="frameBtn">Frame all</button><button class="mini" id="sampleBtn">Load sample</button></div>
    <div id="viewport"><div id="world"><svg id="wires"></svg><div id="nodes"></div></div><div id="marquee" class="marquee"></div></div>
  </main>
  <aside class="inspector" id="inspector"><div class="empty-inspector">Select a node to edit its Unreal expression properties.</div></aside>
</div>
<footer><span>Browser → Unreal Material Editor clipboard bridge</span><span class="status" id="status">Ready</span></footer>
</div>

<div class="modal" id="textModal"><div class="modal-box">
  <div class="modal-head"><strong id="modalTitle">UNREAL CLIPBOARD TEXT</strong><div class="spacer"></div><button class="btn" id="closeModal">Close</button></div>
  <div class="modal-main"><textarea id="modalText" spellcheck="false"></textarea></div>
  <div class="modal-foot"><span id="modalHint" style="color:#69736f;font-size:10px"></span><div class="spacer"></div><button class="btn cyan" id="modalAction">Import</button></div>
</div></div>
<input type="file" id="recipeFile" accept=".mtrl,.mtrlbridge,.txt,.json" style="display:none">
<div class="toast" id="toast"></div>

function prettyExpressionName(cls){return cls.replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/([A-Z]+)([A-Z][a-z])/g,'$1 $2');}
const haveClasses=new Set(CURATED_TEMPLATES.map(t=>t.class));
const EXTENDED_TEMPLATES=UE54_EXPRESSION_CLASSES
 .map(cls=>'MaterialExpression'+cls)
 .filter(cls=>!haveClasses.has(cls))
 .map(cls=>({cat:'UE 5.4 / Extended',name:prettyExpressionName(cls.replace('MaterialExpression','')),class:cls,accent:'pink',inputs:[],outputs:['Output'],props:'',raw:true,extended:true}));
const TEMPLATES=[...CURATED_TEMPLATES,...EXTENDED_TEMPLATES];
const ACCENTS={acid:'#d7ff3f',cyan:'#55f5dd',orange:'#ff7d3a',pink:'#ff5faa'};
let graph={nodes:[],edges:[]};
let selected=null, selection=new Set(), dragging=null, wiring=null, marquee=null;
let view={x:180,y:120,scale:1};
let idSeq=1;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const nodesEl=$('#nodes'), wiresEl=$('#wires'), viewport=$('#viewport'), world=$('#world'), inspector=$('#inspector'), marqueeEl=$('#marquee');

function uid(prefix='n'){return prefix+(idSeq++);} 
function guid(){let s='';for(let i=0;i<32;i++)s+=Math.floor(Math.random()*16).toString(16).toUpperCase();return s;}
function escHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function deepCopy(o){return JSON.parse(JSON.stringify(o));}
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
function status(msg,kind=''){const e=$('#status');e.textContent=msg;e.className='status '+kind;}

function makeNode(t,x=300,y=220,quiet=false){
 const n={id:uid(),name:t.name,class:t.class,accent:t.accent||'cyan',x,y,inputs:(t.inputs||[]).map((p,i)=>({id:uid('p'),name:p[0],prop:p[1],pinGuid:guid()})),outputs:(t.outputs||['Output']).map((p,i)=>({id:uid('p'),name:p,pinGuid:guid(),index:i})),props:t.props||'',rawProps:'',custom:!!t.custom,code:t.code||'',raw:!!t.raw,nodeGuid:guid(),expressionGuid:guid()};
 graph.nodes.push(n);if(!quiet){selectNode(n.id);render();saveLocal()}return n;
}
function findNode(id){return graph.nodes.find(n=>n.id===id)}
function getInput(node,pinId){return node?.inputs.find(p=>p.id===pinId)}
function getOutput(node,pinId){return node?.outputs.find(p=>p.id===pinId)}
function selectNode(id,mode='replace'){
 if(!id)return clearSelection();
 if(mode==='toggle'){if(selection.has(id))selection.delete(id);else selection.add(id)}
 else if(mode==='add')selection.add(id);
 else selection=new Set([id]);
 selected=selection.has(id)?id:(selection.values().next().value||null);renderSelection();renderInspector();updateCounts();
}
function clearSelection(){selection=new Set();selected=null;renderSelection();renderInspector();updateCounts();}
function setSelection(ids,primary=null){selection=new Set(ids);selected=primary&&selection.has(primary)?primary:(selection.values().next().value||null);renderSelection();renderInspector();updateCounts();}
function removeNode(id){graph.nodes=graph.nodes.filter(n=>n.id!==id);graph.edges=graph.edges.filter(e=>e.fromNode!==id&&e.toNode!==id);selection.delete(id);if(selected===id)selected=selection.values().next().value||null;render();saveLocal();}
function removeSelected(){if(!selection.size)return;const ids=new Set(selection);graph.nodes=graph.nodes.filter(n=>!ids.has(n.id));graph.edges=graph.edges.filter(e=>!ids.has(e.fromNode)&&!ids.has(e.toNode));selection=new Set();selected=null;render();saveLocal();}
function removeEdge(id){graph.edges=graph.edges.filter(e=>e.id!==id);renderWires();saveLocal();}

function renderPalette(filter=''){
 const p=$('#palette');p.innerHTML='';const groups={};
 TEMPLATES.filter(t=>(t.name+' '+t.class+' '+t.cat).toLowerCase().includes(filter.toLowerCase())).forEach(t=>(groups[t.cat]??=[]).push(t));
 for(const [cat,items] of Object.entries(groups)){
   const d=document.createElement('div');d.className='cat';d.innerHTML='<h4>'+escHtml(cat)+'</h4>';
   items.forEach(t=>{const b=document.createElement('button');b.className='node-add';b.dataset.accent=t.accent||'cyan';b.innerHTML='<span class="dot"></span><span>'+escHtml(t.name)+'</span>';b.onclick=()=>makeNode(t,(320-view.x)/view.scale+Math.random()*40,(220-view.y)/view.scale+Math.random()*60);d.appendChild(b)});p.appendChild(d);
 }
}
function render(){renderNodes();renderWires();updateCounts();applyView();renderInspector();}
function renderNodes(){
 nodesEl.innerHTML='';
 graph.nodes.forEach(n=>{
  const el=document.createElement('div');el.className='node'+(selection.has(n.id)?' selected':'')+(n.id===selected?' primary-selected':'');el.dataset.id=n.id;el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.setProperty('--accent',ACCENTS[n.accent]||n.accent||'#55f5dd');
  el.innerHTML=`<div class="node-head"><div class="type">${n.custom?'HLSL':n.raw?'RAW':'MTRL'}</div><div class="name">${escHtml(n.name)}</div></div><div class="node-body">${n.inputs.map(p=>`<div class="pin-row"><span class="pin in" data-dir="in" data-pin="${p.id}"></span><span class="pin-label">${escHtml(p.name)}</span></div>`).join('')}${n.outputs.map(p=>`<div class="pin-row out"><span class="pin-label">${escHtml(p.name)}</span><span class="pin out" data-dir="out" data-pin="${p.id}"></span></div>`).join('')}</div><div class="node-foot">${escHtml(n.class.replace('MaterialExpression',''))}</div>`;
  el.onmousedown=e=>{
   if(e.target.closest('.pin'))return;
   if((e.button===1||e.button===2)){
    panning={sx:e.clientX,sy:e.clientY,x:view.x,y:view.y};viewport.classList.add('grabbing');e.preventDefault();e.stopPropagation();return;
   }
   if(e.button!==0||e.target.closest('input,textarea,select,button,a'))return;
   const toggle=e.ctrlKey||e.metaKey,add=e.shiftKey;
   if(toggle){selectNode(n.id,'toggle');if(!selection.has(n.id)){e.preventDefault();e.stopPropagation();return;}}
   else if(add)selectNode(n.id,'add');
   else if(!selection.has(n.id))selectNode(n.id,'replace');
   else {selected=n.id;renderSelection();renderInspector();}
   const positions={};selection.forEach(id=>{const sn=findNode(id);if(sn)positions[id]={x:sn.x,y:sn.y}});
   dragging={id:n.id,startX:e.clientX,startY:e.clientY,positions};
   el.classList.add('drag-active');
   e.preventDefault();e.stopPropagation();
  };
  el.querySelectorAll('.pin').forEach(pin=>pin.onmousedown=e=>startWire(e,n.id,pin.dataset.pin,pin.dataset.dir));
  nodesEl.appendChild(el);
 });
}
function renderSelection(){ $$('.node').forEach(e=>{const on=selection.has(e.dataset.id);e.classList.toggle('selected',on);e.classList.toggle('primary-selected',on&&e.dataset.id===selected)});renderWires(); }
function pinCenter(nodeId,pinId){const el=document.querySelector(`.node[data-id="${nodeId}"] .pin[data-pin="${pinId}"]`);if(!el)return null;const n=findNode(nodeId);const nr=document.querySelector(`.node[data-id="${nodeId}"]`).getBoundingClientRect(), pr=el.getBoundingClientRect();const wr=world.getBoundingClientRect();return{x:(pr.left+pr.width/2-wr.left)/view.scale,y:(pr.top+pr.height/2-wr.top)/view.scale};}
function renderWires(){
 wiresEl.innerHTML='';
 graph.edges.forEach(e=>{const a=pinCenter(e.fromNode,e.fromPin),b=pinCenter(e.toNode,e.toPin);if(!a||!b)return;const dx=Math.max(60,Math.abs(b.x-a.x)*.48);const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M ${a.x} ${a.y} C ${a.x+dx} ${a.y}, ${b.x-dx} ${b.y}, ${b.x} ${b.y}`);p.setAttribute('class','wire'+(selection.has(e.fromNode)&&selection.has(e.toNode)?' selected':''));p.style.pointerEvents='stroke';p.onclick=()=>removeEdge(e.id);wiresEl.appendChild(p)});
 if(wiring&&wiring.mouse){const a=pinCenter(wiring.node,wiring.pin);if(a){const b=wiring.mouse,dx=Math.max(60,Math.abs(b.x-a.x)*.48);const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M ${a.x} ${a.y} C ${a.x+(wiring.dir==='out'?dx:-dx)} ${a.y}, ${b.x+(wiring.dir==='out'?-dx:dx)} ${b.y}, ${b.x} ${b.y}`);p.setAttribute('class','wire preview');wiresEl.appendChild(p)}}
}
function updateCounts(){$('#nodeCount').textContent=graph.nodes.length;$('#edgeCount').textContent=graph.edges.length;$('#selectedCount').textContent=selection.size;}
function startWire(e,node,pin,dir){wiring={node,pin,dir,mouse:null};e.stopPropagation();e.preventDefault();}
function finishWire(e){if(!wiring)return;const target=e.target.closest('.pin');if(target){const nodeEl=target.closest('.node'),dir=target.dataset.dir;if(nodeEl&&dir!==wiring.dir){let fromNode,fromPin,toNode,toPin;if(wiring.dir==='out'){fromNode=wiring.node;fromPin=wiring.pin;toNode=nodeEl.dataset.id;toPin=target.dataset.pin}else{fromNode=nodeEl.dataset.id;fromPin=target.dataset.pin;toNode=wiring.node;toPin=wiring.pin}graph.edges=graph.edges.filter(x=>!(x.toNode===toNode&&x.toPin===toPin));graph.edges.push({id:uid('e'),fromNode,fromPin,toNode,toPin});saveLocal();}}wiring=null;renderWires();}

function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;}
viewport.onwheel=e=>{e.preventDefault();const rect=viewport.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;const old=view.scale;const next=Math.min(1.8,Math.max(.35,old*(e.deltaY<0?1.1:.9)));view.x=mx-(mx-view.x)*(next/old);view.y=my-(my-view.y)*(next/old);view.scale=next;applyView();renderWires();};
let panning=null;
function marqueeSelectionAt(x1,y1,x2,y2,mode,base){
 const vr=viewport.getBoundingClientRect(),l=Math.min(x1,x2),r=Math.max(x1,x2),t=Math.min(y1,y2),b=Math.max(y1,y2),hits=new Set();
 $$('.node').forEach(el=>{const nr=el.getBoundingClientRect(),nl=nr.left-vr.left,nt=nr.top-vr.top,nrgt=nr.right-vr.left,nb=nr.bottom-vr.top;if(nrgt>=l&&nl<=r&&nb>=t&&nt<=b)hits.add(el.dataset.id)});
 let next;if(mode==='add')next=new Set([...base,...hits]);else if(mode==='toggle'){next=new Set(base);hits.forEach(id=>next.has(id)?next.delete(id):next.add(id))}else next=hits;
 selection=next;if(!selection.has(selected))selected=hits.values().next().value||selection.values().next().value||null;renderSelection();renderInspector();updateCounts();
}
viewport.onmousedown=e=>{if(e.target===viewport||e.target===world||e.target===wiresEl){
 if(e.button===1||e.button===2||e.button===0&&e.altKey){panning={sx:e.clientX,sy:e.clientY,x:view.x,y:view.y};viewport.classList.add('grabbing');e.preventDefault();return}
 if(e.button===0){const vr=viewport.getBoundingClientRect(),sx=e.clientX-vr.left,sy=e.clientY-vr.top;marquee={sx,sy,x:sx,y:sy,mode:(e.ctrlKey||e.metaKey)?'toggle':e.shiftKey?'add':'replace',base:new Set(selection),moved:false};if(marquee.mode==='replace')clearSelection();marqueeEl.style.left=sx+'px';marqueeEl.style.top=sy+'px';marqueeEl.style.width='0px';marqueeEl.style.height='0px';marqueeEl.classList.add('show');e.preventDefault()}
}};
viewport.oncontextmenu=e=>e.preventDefault();
window.onmousemove=e=>{
 if(dragging){const dx=(e.clientX-dragging.startX)/view.scale,dy=(e.clientY-dragging.startY)/view.scale;Object.entries(dragging.positions).forEach(([id,pos])=>{const n=findNode(id);if(!n)return;n.x=Math.round(pos.x+dx);n.y=Math.round(pos.y+dy);const el=document.querySelector(`.node[data-id="${id}"]`);if(el){el.style.left=n.x+'px';el.style.top=n.y+'px'}});renderWires()}
 else if(panning){view.x=panning.x+e.clientX-panning.sx;view.y=panning.y+e.clientY-panning.sy;applyView()}
 else if(marquee){const vr=viewport.getBoundingClientRect();marquee.x=Math.max(0,Math.min(vr.width,e.clientX-vr.left));marquee.y=Math.max(0,Math.min(vr.height,e.clientY-vr.top));if(Math.abs(marquee.x-marquee.sx)>3||Math.abs(marquee.y-marquee.sy)>3)marquee.moved=true;const l=Math.min(marquee.sx,marquee.x),t=Math.min(marquee.sy,marquee.y);marqueeEl.style.left=l+'px';marqueeEl.style.top=t+'px';marqueeEl.style.width=Math.abs(marquee.x-marquee.sx)+'px';marqueeEl.style.height=Math.abs(marquee.y-marquee.sy)+'px';marqueeSelectionAt(marquee.sx,marquee.sy,marquee.x,marquee.y,marquee.mode,marquee.base)}
 else if(wiring){const r=world.getBoundingClientRect();wiring.mouse={x:(e.clientX-r.left)/view.scale,y:(e.clientY-r.top)/view.scale};renderWires();}
};
window.onmouseup=e=>{if(dragging){document.querySelector('.node.drag-active')?.classList.remove('drag-active');dragging=null;saveLocal()}if(panning){panning=null;viewport.classList.remove('grabbing')}if(marquee){if(!marquee.moved&&marquee.mode==='replace')clearSelection();marquee=null;marqueeEl.classList.remove('show')}finishWire(e)};
window.onkeydown=e=>{const editing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);if((e.key==='Delete'||e.key==='Backspace')&&selection.size&&!editing){removeSelected();e.preventDefault()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'&&!editing){setSelection(graph.nodes.map(n=>n.id),graph.nodes[0]?.id||null);e.preventDefault()}if(e.key==='Escape'){wiring=null;if(marquee){marquee=null;marqueeEl.classList.remove('show')}renderWires()}};

 const n=findNode(selected);if(!n){inspector.innerHTML='<div class="empty-inspector">Select a node to edit its Unreal expression properties.<br><br>Box-drag empty canvas to select groups. Shift/Ctrl adds to selection. Drag any selected node to move the group. Click a wire to delete it.</div>';return}

// MTRL//SCRIPT v1 -------------------------------------------------------------
// Compact, deterministic chat -> graph protocol. A recipe may be pasted directly
// from markdown; fences/prose outside MTRL_SCRIPT..END_SCRIPT are ignored.
const MTRL_PROTOCOL = `MTRL//SCRIPT v1 — chat-to-material graph protocol

Ask an assistant for a MTRL//SCRIPT recipe. Paste the returned block into AI Build.
The tool creates the graph; Copy All or Copy Selected then emits UE 5.4.x clipboard text.
For a fresh chat, prefer the AI Context export: it includes this protocol plus the exact live node catalog, curated pins/defaults, and safe rules for extended nodes.

Canonical commands (pipe-separated):
MTRL_SCRIPT 1
GRAPH | Human readable graph name
MODE | replace                  # replace or append
NODE | id | Node Name Or Class | x | y | optional display name
SCALAR | id | Parameter Name | default | x | y
VECTOR | id | Parameter Name | r,g,b,a | x | y
CONST | id | value | x | y
VEC2 | id | x,y | xPos | yPos
VEC3 | id | x,y,z | xPos | yPos
VEC4 | id | x,y,z,w | xPos | yPos
CUSTOM | id | Display Name | CMOT_Float1/2/3/4 | x | y
INPUT | nodeId | Visible Name | serialized property (optional)
OUTPUT | nodeId | Visible Name | output index (optional)
PROPS | nodeId
Exact Unreal serialized property lines...
ENDPROPS
CODE | customNodeId
HLSL code...
ENDCODE
LINK | fromNode | outputPin | toNode | inputPin
END_SCRIPT

Notes:
- Node type may be a palette name (Multiply, Fresnel, Texture Sample), the short class
  name (TextureCoordinate), or full class (MaterialExpressionTextureCoordinate).
- Pins are addressed by visible pin name; numeric indexes are also accepted.
- INPUT/OUTPUT replaces a recipe-created node's default pins the first time it is used.
- PROPS is emitted directly into the Unreal MaterialExpression object.
- Custom HLSL INPUT properties automatically become custom:<name> if omitted.
- Lines beginning # or // are comments. Unknown commands fail loudly instead of guessing.
- The protocol is construction syntax, not an encyclopedia of Unreal node semantics. The AI Context export supplies the live palette/pins. For unfamiliar EXTENDED nodes, verify UE 5.4 docs/source when research is available; otherwise do not invent pins/properties.

Example:
MTRL_SCRIPT 1
GRAPH | UV Pulse
MODE | replace
NODE | uv | Texture Coordinate | 80 | 120
NODE | time | Time | 80 | 320
SCALAR | speed | Pulse Speed | 0.35 | 300 | 320
NODE | mul | Multiply | 520 | 300
CUSTOM | warp | UV Warp | CMOT_Float2 | 760 | 120
INPUT | warp | UV
INPUT | warp | T
CODE | warp
float2 w = float2(sin((UV.y+T)*6.28318), cos((UV.x+T)*6.28318));
return UV + w * 0.02;
ENDCODE
LINK | time | Output | mul | A
LINK | speed | Output | mul | B
LINK | uv | UV | warp | UV
LINK | mul | Output | warp | T
END_SCRIPT`;

  if(c.cmd==='INPUT'){const n=ids.get(a[0]);if(!n)throw new Error(`INPUT references unknown node: ${a[0]}`);if(!explicitInputs.has(a[0])){n.inputs=[];explicitInputs.add(a[0])}const name=a[1]||`Input${n.inputs.length}`,prop=a[2]||(n.custom?'custom:'+name:name);n.inputs.push({id:uid('p'),name,prop,pinGuid:guid()});continue}
  if(c.cmd==='OUTPUT'){const n=ids.get(a[0]);if(!n)throw new Error(`OUTPUT references unknown node: ${a[0]}`);if(!explicitOutputs.has(a[0])){n.outputs=[];explicitOutputs.add(a[0])}n.outputs.push({id:uid('p'),name:a[1]||`Output${n.outputs.length}`,index:Number(a[2]??n.outputs.length)||0,pinGuid:guid()});continue}
  if(c.cmd==='PROPS'){const n=ids.get(c.id);if(!n)throw new Error(`PROPS references unknown node: ${c.id}`);c.body.split(/\r?\n/).forEach(line=>{const t=line.trim();if(!t)return;const m=t.match(/^([A-Za-z_]\w*)=(.*)$/);if(m)setPropLine(n,m[1],m[2]);else n.props=[n.props,t].filter(Boolean).join('\n')});continue}
  if(c.cmd==='CODE'){const n=ids.get(c.id);if(!n)throw new Error(`CODE references unknown node: ${c.id}`);if(!n.custom)throw new Error(`CODE target is not a Custom HLSL node: ${c.id}`);n.code=c.body;continue}
  if(c.cmd==='LINK'){pendingLinks.push(c);continue}
  throw new Error(`Unknown MTRL//SCRIPT command${c.line?' on line '+c.line:''}: ${c.cmd}`);
 }
 for(const c of pendingLinks){const a=c.args,src=ids.get(a[0]),dst=ids.get(a[2]);if(!src)throw new Error(`LINK source node not found: ${a[0]}`);if(!dst)throw new Error(`LINK target node not found: ${a[2]}`);const op=recipePin(src,a[1],'out'),ip=recipePin(dst,a[3],'in');if(!op)throw new Error(`Output '${a[1]}' not found on ${a[0]}`);if(!ip)throw new Error(`Input '${a[3]}' not found on ${a[2]}`);graph.edges=graph.edges.filter(e=>!(e.toNode===dst.id&&e.toPin===ip.id));graph.edges.push({id:uid('e'),fromNode:src.id,fromPin:op.id,toNode:dst.id,toPin:ip.id})}
 selected=graph.nodes[graph.nodes.length-1]?.id||null;selection=selected?new Set([selected]):new Set();render();frameAll();saveLocal();toast(`AI built ${ids.size} nodes`);status(`${graphLabel}: ${ids.size} nodes built`,'good');return ids.size;
}

function frameAll(){if(!graph.nodes.length){view={x:180,y:120,scale:1};applyView();return}const xs=graph.nodes.map(n=>n.x),ys=graph.nodes.map(n=>n.y);const minX=Math.min(...xs),maxX=Math.max(...xs)+190,minY=Math.min(...ys),maxY=Math.max(...ys)+180;const r=viewport.getBoundingClientRect();const sc=Math.min(1.15,Math.max(.4,Math.min((r.width-100)/(maxX-minX||1),(r.height-100)/(maxY-minY||1))));view.scale=sc;view.x=50-minX*sc;view.y=50-minY*sc;applyView();renderWires();}
function saveLocal(){try{localStorage.setItem('mtrlbridge.graph',JSON.stringify({graph,view,idSeq}))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem('mtrlbridge.graph'));if(d?.graph){graph=d.graph;view=d.view||view;idSeq=d.idSeq||100;selected=graph.nodes[0]?.id||null;selection=selected?new Set([selected]):new Set();return true}}catch(e){}return false}
function loadSample(){graph={nodes:[],edges:[]};idSeq=1;const uv=makeNode(TEMPLATES.find(t=>t.name==='Texture Coordinate'),100,200);const time=makeNode(TEMPLATES.find(t=>t.name==='Time'),100,390);const speed=makeNode(TEMPLATES.find(t=>t.name==='Scalar Parameter'),350,390);speed.name='Speed';speed.props='DefaultValue=0.250000\nParameterName="Speed"\nExpressionGUID='+guid();const mul=makeNode(TEMPLATES.find(t=>t.name==='Multiply'),610,360);const custom=makeNode(TEMPLATES.find(t=>t.name==='Custom HLSL'),880,210);custom.name='UV Warp';custom.inputs=[{id:uid('p'),name:'UV',prop:'custom:UV',pinGuid:guid()},{id:uid('p'),name:'T',prop:'custom:T',pinGuid:guid()}];custom.code='float2 wobble = float2(sin((UV.y + T) * 6.28318), cos((UV.x + T) * 6.28318));\nreturn UV + wobble * 0.02;';custom.props='Description="UV Warp"\nOutputType=CMOT_Float2';graph.edges.push({id:uid('e'),fromNode:time.id,fromPin:time.outputs[0].id,toNode:mul.id,toPin:mul.inputs[0].id},{id:uid('e'),fromNode:speed.id,fromPin:speed.outputs[0].id,toNode:mul.id,toPin:mul.inputs[1].id},{id:uid('e'),fromNode:uv.id,fromPin:uv.outputs[0].id,toNode:custom.id,toPin:custom.inputs[0].id},{id:uid('e'),fromNode:mul.id,fromPin:mul.outputs[0].id,toNode:custom.id,toPin:custom.inputs[1].id});selected=custom.id;selection=new Set([custom.id]);render();frameAll();saveLocal();}

const AI_NODE_HINTS={
 'MaterialExpressionCustom':'Arbitrary HLSL expression. Declare every named input with INPUT and code with CODE.',
 'MaterialExpressionPreviousFrameSwitch':'Selects current-frame versus previous-frame data; useful for correct motion vectors with animated/WPO materials.',
 'MaterialExpressionPerInstanceCustomData':'Reads per-instance custom primitive/instance data by index.',
 'MaterialExpressionRuntimeVirtualTextureSample':'Samples an assigned Runtime Virtual Texture; asset assignment and material domain settings still matter.',
 'MaterialExpressionSceneTexture':'Reads a selected scene texture; availability depends on material domain/blend path.',
 'MaterialExpressionDistanceToNearestSurface':'Global distance-field distance query; requires the relevant distance-field rendering support.',
 'MaterialExpressionDistanceFieldGradient':'Global distance-field gradient/direction query.',
 'MaterialExpressionMakeMaterialAttributes':'Builds a Material Attributes struct from individual channels.',
 'MaterialExpressionBreakMaterialAttributes':'Extracts channels from a Material Attributes struct.',
 'MaterialExpressionSetMaterialAttributes':'Overwrites selected fields of a Material Attributes struct.',
 'MaterialExpressionGetMaterialAttributes':'Extracts selected fields from a Material Attributes struct.'
};
function buildAIContext(){
 const lines=[MTRL_PROTOCOL,'','MTRL//BRIDGE LIVE NODE CATALOG','Generated from this exact tool build. Use this catalog to know what can be spawned and how curated pins are named.','','AI RULES:',
 '- Prefer entries marked CURATED because their visible inputs/outputs and baseline serialized properties are known to this tool.',
 '- EXTENDED entries are spawnable UE 5.4 expression classes, but their pins/properties are intentionally not guessed. If you need one, verify its UE 5.4 behavior/pins from Epic docs/source when web research is available, or have the user import one real node from Unreal and use INPUT/OUTPUT/PROPS to match it.',
 '- Do not assume MTRL//SCRIPT itself teaches material theory. Reason from Unreal material knowledge; use this catalog as the capability/pin contract.',
 '- Native nodes are preferred. Custom HLSL is valid when it makes the requested effect substantially cleaner or requires functionality awkward in stock nodes.',''];
 TEMPLATES.forEach(t=>{const ins=(t.inputs||[]).map(p=>`${p[0]}=>${p[1]}`).join(', ')||'none',outs=(t.outputs||[]).join(', ')||'none',kind=t.extended?'EXTENDED':'CURATED',hint=AI_NODE_HINTS[t.class]?` | NOTE: ${AI_NODE_HINTS[t.class]}`:'';lines.push(`[${kind}] ${t.name} | ${t.class} | category=${t.cat} | inputs=${ins} | outputs=${outs}${hint}`);if(!t.extended&&t.props)lines.push(`  defaults: ${String(t.props).replace(/\n/g,' ; ')}`)});
 return lines.join('\n');
}

function showModal(mode,text=''){
 const cfg={
  import:['PASTE UNREAL MATERIAL NODES','Import graph','Copy nodes in the UE Material Editor (Ctrl+C), paste here, then Import.'],
  export:['UNREAL CLIPBOARD TEXT','Copy text','Paste this directly into an open Unreal Material graph.'],
  recipe:['AI BUILD · MTRL//SCRIPT','Build graph','Paste a MTRL//SCRIPT recipe from chat. You can also drop a .mtrl/.txt recipe onto the app.'],
  protocol:['MTRL//SCRIPT v1 PROTOCOL','Copy protocol','Syntax/contract only. Use AI Context when you want the assistant to know this build’s full palette and pins.'],
  context:['MTRL//BRIDGE AI CONTEXT','Copy AI context','Protocol + this exact build’s live node catalog, curated pins/defaults, and rules for extended nodes.']
 }[mode]||['TEXT','Close',''];
 const m=$('#textModal');m.classList.add('show');$('#modalText').value=text;$('#modalTitle').textContent=cfg[0];$('#modalAction').textContent=cfg[1];$('#modalHint').textContent=cfg[2];m.dataset.mode=mode;setTimeout(()=>$('#modalText').focus(),20)
}
$('#closeModal').onclick=()=>$('#textModal').classList.remove('show');$('#textModal').onclick=e=>{if(e.target===$('#textModal'))$('#textModal').classList.remove('show')};
$('#modalAction').onclick=async()=>{const mode=$('#textModal').dataset.mode;try{if(mode==='import'){importUE($('#modalText').value);$('#textModal').classList.remove('show')}else if(mode==='recipe'){importRecipe($('#modalText').value);$('#textModal').classList.remove('show')}else await copyText($('#modalText').value)}catch(e){toast(e.message);status(e.message,'warn')}};
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied to clipboard');status('Clipboard ready','good')}catch(e){const ta=$('#modalText');if(ta){ta.select();document.execCommand('copy');toast('Copied')}else showModal('export',t)}}
$('#copyBtn').onclick=async()=>{if(!graph.nodes.length)return toast('Add at least one node');const t=exportUE();await copyText(t);status(`Copied all ${graph.nodes.length} nodes — paste in Material Editor`,'good')};
$('#copySelectedBtn').onclick=async()=>{if(!selection.size)return toast('Select one or more nodes first');const t=exportUE(selection);await copyText(t);status(`Copied ${selection.size} selected node${selection.size===1?'':'s'} — internal links only`,'good')};
$('#previewBtn').onclick=()=>showModal('export',exportUE());
$('#importBtn').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t&&t.includes('MaterialGraphNode')){importUE(t);return}}catch(e){}showModal('import','')};
$('#aiBuildBtn').onclick=async()=>{try{const t=await navigator.clipboard.readText();if(t&&/MTRL(?:\/\/)?_?SCRIPT\s+1/i.test(t)){importRecipe(t);return}}catch(e){}showModal('recipe','')};
$('#protocolBtn').onclick=()=>showModal('protocol',MTRL_PROTOCOL);
$('#aiContextBtn').onclick=()=>showModal('context',buildAIContext());
$('#recipeFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{importRecipe(await f.text())}catch(err){toast(err.message);status(err.message,'warn')}e.target.value=''};
window.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault()});
window.addEventListener('drop',async e=>{const f=e.dataTransfer?.files?.[0];if(!f)return;e.preventDefault();try{const t=await f.text();if(/MTRL(?:\/\/)?_?SCRIPT\s+1/i.test(t))importRecipe(t);else if(t.includes('MaterialGraphNode'))importUE(t);else throw new Error('Dropped file is not a MTRL//SCRIPT recipe or Unreal graph text')}catch(err){toast(err.message);status(err.message,'warn')}});
$('#newBtn').onclick=()=>{graph={nodes:[],edges:[]};selected=null;selection=new Set();view={x:180,y:120,scale:1};render();saveLocal();status('New graph')};
$('#frameBtn').onclick=frameAll;$('#sampleBtn').onclick=loadSample;$('#search').oninput=e=>renderPalette(e.target.value);
renderPalette();if(!loadLocal())loadSample();else render();
</script>
